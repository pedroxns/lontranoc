[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "otterpilot"
dynamic = ["version"]

description = "AI copilot for homelabs, self-hosted services and small infrastructure environments."

requires-python = ">=3.11"

authors = [
  { name = "Lontra Labs" }
]

keywords = [
  "homelab",
  "self-hosted",
  "observability",
  "infrastructure",
  "automation",
  "aiops",
  "copilot"
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration"
]

dependencies = [
  "fastapi>=0.110",
  "httpx",
  "paho-mqtt>=2",
  "pydantic>=2",
  "python-dotenv",
  "PyYAML",
  "requests",
  "uvicorn>=0.29"
]


[project.scripts]
otterpilot = "otterpilot.cli.main:main"


[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff"
]


[project.urls]
Repository = "https://github.com/pedroxns/lontranoc"
Issues = "https://github.com/pedroxns/lontranoc/issues"


[tool.setuptools.dynamic]
version = { attr = "otterpilot.version.__version__" }


[tool.setuptools.packages.find]
where = ["."]
include = ["otterpilot*"]


[tool.setuptools.package-data]
"otterpilot.routing" = ["routes.yaml"]
"otterpilot.web" = ["static/*", "static/**/*"]


[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "venv",
  "__pycache__"
]


[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
