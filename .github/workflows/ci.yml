name: OtterPilot CI

on:
  push:
    branches:
      - main
      - refactor/otterpilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (pyflakes rules)
        run: ruff check --select F,E9,B otterpilot tests

      - name: Tests
        run: pytest -q

      - name: Package builds and ships static files
        run: |
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()
          for required in ("otterpilot/web/static/app.js", "otterpilot/web/static/index.html", "otterpilot/routing/routes.yaml"):
              assert required in names, required
          print("wheel OK")
          PY

      - name: Validate YAML examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for file in Path("deploy/config").glob("*.example"):
              yaml.safe_load(file.read_text())
              print("YAML OK:", file)
          PY

      - name: Validate shell and JavaScript
        run: |
          bash -n deploy/install.sh
          node --check otterpilot/web/static/app.js
